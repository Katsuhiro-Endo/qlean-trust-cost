name = "qlean-trust-cost"
version = "0.1.0"
defaultTargets = ["VerifiedMath", "QLeanMathematicalSpecifications", "QLeanCircuits", "QLeanCorrespondence"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

